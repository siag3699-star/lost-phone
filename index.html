<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이청현의 휴대폰</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #17191d; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #222; }
        
        /* 스마트폰 형태 틀 */
        .phone { width: 360px; height: 740px; background: linear-gradient(160deg, #4fa3e3, #1d529e); border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        /* 상단 상태바 */
        .status { height: 30px; padding: 6px 16px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: white; background: rgba(0,0,0,0.15); font-weight: bold; }
        
        /* 잠금 화면 */
        #lock { height: calc(100% - 30px); padding: 30px 20px; display: flex; flex-direction: column; justify-content: space-between; color: white; text-align: center; box-sizing: border-box; }
        .clock { font-size: 58px; font-weight: 200; margin-top: 40px; }
        .date { font-size: 14px; margin-top: 5px; opacity: 0.9; }
        .notification { margin-top: 50px; background: rgba(255,255,255,0.25); backdrop-filter: blur(10px); border-radius: 16px; padding: 16px; text-align: left; line-height: 1.6; font-size: 14px; }
        .unlock { margin: 40px auto 0; padding: 12px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.2); color: white; font-size: 14px; cursor: pointer; width: fit-content; }
        
        /* 홈 화면 */
        #home { display: none; flex-direction: column; height: calc(100% - 30px); justify-content: space-between; }
        .header { padding: 30px 20px 10px; text-align: left; color: white; }
        .header h2 { font-size: 26px; margin: 4px 0; font-weight: bold; }
        .muted { font-size: 12px; opacity: 0.75; }
        
        /* 앱 아이콘 그리드 */
        .apps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 10px; padding: 15px; flex-grow: 1; align-content: flex-start; }
        .app { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 11px; color: white; cursor: pointer; }
        .ico { width: 55px; height: 55px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 6px; font-size: 24px; color: white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        
        .green { background: linear-gradient(135deg, #5ce1e6, #38b6ff); }
        .blue { background: linear-gradient(135deg, #4b8ce0, #2c599d); }
        .orange { background: linear-gradient(135deg, #ff9a9e, #fecfef); }
        .purple { background: linear-gradient(135deg, #b19ffb, #745ae1); }
        .gray { background: linear-gradient(135deg, #8a95a5, #4e5969); }
        
        /* 서브 페이지 기본 설정 */
        #page { display: none; background: #f4f5f7; position: absolute; top: 30px; left: 0; width: 100%; height: calc(100% - 30px); z-index: 10; overflow-y: auto; }
        .back { background: #e7e9ed; padding: 12px 15px; border: none; width: 100%; text-align: left; font-size: 14px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #dcdde1; color: #333; }
        .page-title-bar { padding: 20px 15px 5px; }
        #heading { font-size: 22px; color: #111; }
        #list { padding: 0 15px 20px; }
        .item { padding: 14px 5px; border-bottom: 1px solid #e2e3e6; cursor: pointer; }
        .item b { font-size: 15px; color: #111; }
        .item small { display: block; color: #858990; margin-top: 4px; font-size: 12px; }
        
        /* 메시지 상세 대화창 (말풍선) */
        #detail { padding: 15px; }
        .bubble { background: #fef01b; color: #000; padding: 10px 14px; border-radius: 14px 0px 14px 14px; margin: 8px 0 8px auto; width: fit-content; max-width: 80%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); text-align: left; }
        .reply { background: white; color: #000; padding: 10px 14px; border-radius: 0px 14px 14px 14px; margin: 8px auto 8px 0; width: fit-content; max-width: 80%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); text-align: left; }
        .photo { background: #e1e5e9; border-radius: 12px; padding: 40px 10px; text-align: center; margin: 10px 0; font-size: 14px; color: #555; }
        
        /* 하단 전송 구역 */
        .input-area { display: flex; gap: 5px; margin-top: 15px; padding-bottom: 20px; }
        input { padding: 10px 12px; border: 1px solid #ddd; border-radius: 20px; flex-grow: 1; font-size: 14px; outline: none; }
        .send-btn { background: #ffeb33; border: 1px solid #ddd; padding: 0 15px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; }
    </style>
</head>

            <button class="unlock" onclick="unlock()">잠금 화면 열기　›</button>

    <!-- 홈화면 -->

        <!-- 하위 페이지 구역 -->
        <section id="page">
            <button class="back" onclick="back()">‹ 홈으로</button>
            <div class="page-title-bar"><h3 id="heading"></h3></div>
            <div id="list"></div>
            <div id="detail"></div>
        </section>
    </section>
</div>
