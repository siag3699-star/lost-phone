<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이청현의 휴대폰</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17191d;font-family:Arial,sans-serif;color:#222}
.phone{max-width:390px;min-height:100vh;margin:auto;background:#f4f5f7}
.status{height:30px;padding:8px 18px;background:white;font-size:12px;display:flex;justify-content:space-between}
/* 잠금화면과 홈화면 배경을 마인크래프트 캐릭터 이미지로 일괄 적용 */
#lock{min-height:calc(100vh - 30px);padding:25px;color:white;text-align:center;background:linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://squarespace-cdn.com') no-repeat center center;background-size:cover}
.clock{font-size:68px;font-weight:200;margin-top:75px}
.date{font-size:14px;margin-top:5px}
.notification{margin-top:65px;background:#ffffff30;border-radius:16px;padding:17px;text-align:left;line-height:1.7}
.unlock{margin-top:45px;padding:14px 25px;border-radius:30px;border:1px solid #ffffff80;background:#ffffff20;color:white}
#home{display:none;min-height:calc(100vh - 30px);background:linear-gradient(rgba(0,0,0,0.1), rgba(0,0,0,0.1)), url('https://squarespace-cdn.com') no-repeat center center;background-size:cover}
.header{padding:24px 20px;background:rgba(255,255,255,0.85)}
.header h2{margin:10px 0}
.muted{font-size:12px;color:#858990}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:27px 8px;padding:28px 15px}
.app{text-align:center;font-size:13px;cursor:pointer;color:white;text-shadow:1px 1px 3px rgba(0,0,0,0.8)}
.ico{width:55px;height:55px;border-radius:16px;display:grid;place-items:center;margin:0 auto 8px;font-size:25px;color:white;text-shadow:none}
.green{background:#4db779}.blue{background:#4b8ce0}.orange{background:#e5a052}.purple{background:#8b78d8}.gray{background:#737d88}.red{background:#dc7278}
#page{display:none;padding:18px;min-height:65vh;background:#f4f5f7;color:#222}
.back{background:#e7e9ed;padding:10px 15px;border:none;cursor:pointer}
.item{padding:15px 3px;border-bottom:1px solid #e2e3e6;cursor:pointer}
.item small {display:block;color:#858990;margin-top:5px}
#detail{line-height:1.8;white-space:pre-line;margin-top:18px}
.bubble{background:#d9eaff;padding:11px 14px;border-radius:15px;margin:10px 0 10px auto;width:fit-content;max-width:90%}
.reply{background:white;padding:11px 14px;border-radius:15px;margin:10px auto 10px 0;width:fit-content;max-width:90%}
.photo{background:#e1e5e9;border-radius:12px;padding:24px 8px;text-align:center;margin:8px 0}
input{padding:12px;border:1px solid #ddd;border-radius:10px;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="phone">
<div class="status"><span>20:18　● Wi-Fi</span><span>▰ 82%</span></div>

<section id="lock">
<div class="clock" id="clock">20:18</div>
<div class="date" id="date">10월 18일</div>
<div class="notification">
<b>메시지 · 알림</b><br>
이청현<br>
읽지 않은 메시지가 있습니다.
</div>
<p style="margin-top:35px;font-size:13px">이 휴대폰은 이청현의 소유입니다.</p>
<button class="unlock" onclick="unlock()">잠금 화면 열기　›</button>
</section>

<section id="home">
<div class="header">
<div class="muted">내 휴대폰</div>
<h2>이청현</h2>
<div class="muted">마지막 사용 기록</div>
</div>
<div class="apps">
<div class="app" onclick="openPage('messages')"><div class="ico green">✉</div>메시지</div>
<div class="app" onclick="openPage('calls')"><div class="ico green">☎</div>전화</div>
<div class="app" onclick="openPage('contacts')"><div class="ico blue">♙</div>연락처</div>
<div class="app" onclick="openPage('photos')"><div class="ico orange">▧</div>갤러리</div>
<div class="app" onclick="openPage('notes')"><div class="ico purple">▤</div>메모</div>
<div class="app" onclick="openPage('settings')"><div class="ico gray">⚙</div>설정</div>
</div>
<section id="page">
<button class="back" onclick="back()">‹ 홈으로</button>
<h3 id="heading"></h3>
<div id="list"></div>
<div id="detail"></div>
</section>
</section>
</div>

function unlock(){
document.getElementById("lock").style.display="none";
document.getElementById("home").style.display="block";
}

function openPage(name){
document.querySelector(".apps").style.display="none";
document.querySelector("#home .header").style.display="none";
document.getElementById("page").style.display="block";
document.getElementById("heading").textContent=data[name].title;
document.getElementById("detail").innerHTML="";
const list=document.getElementById("list");
list.style.display="block";
list.innerHTML="";
data[name].items.forEach((item,index)=>{
const el=document.createElement("div");
el.className="item";
el.innerHTML="<b>"+item[0]+"</b><small>"+item[1]+"</small>";
el.onclick=()=>showDetail(name,index);
list.appendChild(el);
});
}

function showDetail(name,index){
const item=data[name].items[index];
const list=document.getElementById("list");
const detail=document.getElementById("detail");
list.style.display="none";
detail.innerHTML="";
if(name==="messages"){
const chat=conversations[item[0]]||[
["them","어디야?"],
["me","지금 가요"],
["them","도착하면 연락해."]
];
chat.forEach(m=>{
const bubble=document.createElement("div");
bubble.className=m[0]==="me"?"bubble":"reply";
bubble.textContent=m[1];
detail.appendChild(bubble);
});
const input=document.createElement("input");
input.placeholder="메시지를 입력해 보세요";
detail.appendChild(input);
const send=document.createElement("button");
send.textContent="보내기";
send.style.marginTop="8px";
send.onclick=()=>{
const value=input.value.trim();
if(!value)return;
const bubble=document.createElement("div");
bubble.className="bubble";
bubble.textContent=value;
detail.insertBefore(bubble,input);
input.value="";
};
detail.appendChild(send);
}else if(name==="photos"){
detail.innerHTML="<div class='photo'>▧<br><br>"+item[0]+"</div><p>"+item[2]+"</p><p class='muted'>예시 갤러리입니다.</p>";
}else{
detail.textContent=item[0]+"\n"+item[1]+"\n\n"+item[2];
}
}

function back(){
if(document.getElementById("list").style.display==="none"){
document.getElementById("list").style.display="block";
document.getElementById("detail").innerHTML="";
return;
}
document.getElementById("page").style.display="none";
document.querySelector(".apps").style.display="grid";
document.querySelector("#home .header").style.display="block";
}

function updateClock(){
const now=new Date();
document.getElementById("clock").textContent=
String(now.getHours()).padStart(2,"0")+":"+
String(now.getMinutes()).padStart(2,"0");
document.getElementById("date").textContent=
(now.getMonth()+1)+"월 "+now.getDate()+"일";
}
updateClock();
setInterval(updateClock,30000);
</script>
</body>
</html>
