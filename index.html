<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
<title>이청현의 휴대폰</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #11141a; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

/* 리얼 스마트폰 외형 틀 고정 */
.phone { width: 360px; height: 740px; border-radius: 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.8); position: relative; overflow: hidden; display: flex; flex-direction: column; background: #000; border: 4px solid #2d3139; }

/* 반투명 상단바 */
.status { height: 32px; padding: 6px 18px; background: rgba(0, 0, 0, 0.3); font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: white; z-index: 100; font-weight: bold; backdrop-filter: blur(10px); }

/* 화면 겹침 절대 방지 레이아웃 */
.screen { position: absolute; top: 32px; left: 0; width: 100%; height: calc(100% - 32px); display: flex; flex-direction: column; }

/* [수정] 외부 이미지 대신 CSS 그래픽으로 완벽 구현한 배경화면 (절대 안 터짐) */
.phone-bg { background: linear-gradient(160deg, #1f3c73, #436aa8, #a3bfe3); position: relative; }
.phone-bg::before { content: ''; position: absolute; bottom: 0; width: 100%; height: 45%; background: linear-gradient(to top, #719363, #9cb88a); border-top-left-radius: 50% 20%; border-top-right-radius: 50% 20%; }

/* 잠금 화면 */
#lock { z-index: 30; padding: 40px 24px; text-align: center; justify-content: space-between; }
.clock { font-size: 64px; font-weight: 200; margin-top: 50px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
.date { font-size: 14px; margin-top: 5px; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }

/* 반투명 알림창 */
.notification { margin-top: 65px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 16px; padding: 17px; text-align: left; line-height: 1.7; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.15); }
.unlock { margin-top: 45px; padding: 14px 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.6); background: rgba(0, 0, 0, 0.4); color: white; font-size: 14px; font-weight: bold; cursor: pointer; width: fit-content; margin-left: auto; margin-right: auto; outline: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
.unlock:active { background: rgba(0, 0, 0, 0.6); }

/* 바탕 홈 화면 */
#home { z-index: 10; display: none; }
.header { padding: 35px 24px 10px; text-align: left; color: white; z-index: 2; }
.header h2 { margin: 6px 0; font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.muted { font-size: 12px; opacity: 0.95; text-shadow: 0 1px 3px rgba(0,0,0,0.5); color: white; font-weight: bold; }

/* 앱 아이콘 3열 정밀 정렬 */
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 8px; padding: 25px 15px; z-index: 2; }
.app { text-align: center; font-size: 12px; color: white; font-weight: bold; cursor: pointer; text-shadow: 0 1px 4px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; }
.ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 8px; font-size: 26px; color: white; box-shadow: 0 5px 12px rgba(0,0,0,0.3); }
.app:active .ico { transform: scale(0.92); }

.green { background: linear-gradient(135deg, #5ce19f, #229a57); }
.blue { background: linear-gradient(135deg, #66a6ff, #2962ff); }
.orange { background: linear-gradient(135deg, #ffb347, #ffcc00); }
.purple { background: linear-gradient(135deg, #cc99ff, #7744ff); }
.gray { background: linear-gradient(135deg, #a1a8b3, #4e5561); }

/* 내부 상세 페이지 (슬라이드 애니메이션 적용) */
#page { z-index: 50; display: none; background: #f4f5f7; overflow-y: auto; color: #222; transform: translateY(100%); transition: transform 0.25s ease-out; }
#page.active { transform: translateY(0); display: flex !important; }
.back { background: #e7e9ed; padding: 14px 20px; border: none; width: 100%; text-align: left; font-size: 14px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #dcdde1; color: #111; }
.page-title-bar { padding: 24px 20px 5px; background: #ffffff; }
#heading { font-size: 22px; color: #111; font-weight: bold; }
#list { padding: 0 10px 20px; background: #ffffff; width: 100%; }

.item { padding: 16px 14px; border-bottom: 1px solid #e2e3e6; cursor: pointer; text-align: left; }
.item b { font-size: 15px; color: #111; display: block; margin-bottom: 3px; }
.item small { display: block; color: #858990; font-size: 12px; }

/* 카카오톡 스타일 대화방 인터페이스 */
#detail { padding: 15px; background: #b2c7da; min-height: calc(100% - 50px); display: flex; flex-direction: column; width: 100%; }
.bubble { background: #ffec42; color: #000; padding: 10px 14px; border-radius: 14px 0px 14px 14px; margin: 6px 0 6px auto; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; word-break: break-all; }
.reply { background: white; color: #000; padding: 10px 14px; border-radius: 0px 14px 14px 14px; margin: 6px auto 6px 0; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; word-break: break-all; }
.photo { background: #ffffff; border-radius: 12px; padding: 40px 10px; text-align: center; margin: 8px 0; font-size: 14px; border: 1px solid #e2e3e6; }
input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; margin-top: auto; font-size: 14px; outline: none; background: white; color: #000; }
</style>
</head>
<body>
<div class="phone">
    <div class="status">
        <span id="top-clock">20:18</span>
        <div class="status-right">
            <span>● Wi-Fi</span>
            <span>▰ 82%</span>

    <!-- 잠금 화면 -->
    <section id="lock" class="screen phone-bg">
        <div>
            <div class="clock" id="clock">20:18</div>
            <div class="date" id="date">10월 18일 일요일</div>
            <div class="notification">
                <b style="color: #ff3b30;">✉ 메시지 · 알림</b>

                <small>읽지 않은 메시지가 있습니다.</small>
            </div>
        </div>
        <div>
            <p style="font-size:12px; font-weight: bold; color: white; text-shadow: 1px 1px 2px rgba(0,0,0,0.5); margin-bottom: 10px;">이 휴대폰은 이청현의 소유입니다.</p>
            <button class="unlock" onclick="unlock()">잠금 화면 열기 〉</button>
        </div>
    </section>

    <!-- 홈 화면 -->
    <section id="home" class="screen phone-bg">
        <div class="header">
            <div class="muted">내 휴대폰</div>
            <h2>이청현</h2>
            <div class="muted">마지막 사용 기록</div>
        </div>
        <div class="apps">
            <div class="app" onclick="openPage('messages')"><div class="ico green">✉</div>메시지</div>
            <div class="app" onclick="openPage('calls')"><div class="ico green">☎</div>전화</div>

            <div class="app" onclick="openPage('notes')"><div class="ico purple">▤</div>메모</div>
            <div class="app" onclick="openPage('settings')"><div class="ico gray">⚙</div>설정</div>
        </div>
    </section>

    <!-- 세부 화면 구역 -->
    <section id="page" class="screen">
        <button class="back" onclick="back()">‹ 홈으로</button>
        <div class="page-title-bar"><h3 id="heading"></h3></div>
        <div id="list"></div>
        <div id="detail"></div>
    </section>
</div>
