<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
<title>이청현의 휴대폰</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #17191d; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

/* 리얼 스마트폰 규격 프레임 정의 (화면 밀림 현상 방지) */
.phone { width: 360px; height: 740px; border-radius: 36px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); position: relative; overflow: hidden; display: flex; flex-direction: column; background: #f4f5f7; border: 4px solid #2d3139; }
.status { height: 30px; padding: 8px 18px; background: white; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: #222; font-weight: bold; z-index: 100; }

/* 화면 절대 겹침 방지 독립 컨테이너 */
.screen { position: absolute; top: 30px; left: 0; width: 100%; height: calc(100% - 30px); display: flex; flex-direction: column; overflow: hidden; }

/* 마인크래프트 캐릭터 배경화면 지정 */
.phone-bg { background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)), url('https://squarespace-cdn.com') no-repeat center center; background-size: cover; }

/* 잠금 화면 */
#lock { z-index: 40; padding: 30px 24px; text-align: center; justify-content: space-between; display: flex; color: white; }
.clock { font-size: 64px; font-weight: 200; margin-top: 50px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
.date { font-size: 14px; margin-top: 5px; text-shadow: 0 2px 5px rgba(0,0,0,0.4); }
.notification { margin-top: 65px; background: rgba(255,255,255,0.25); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 16px; padding: 17px; text-align: left; line-height: 1.7; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }

/* 터치 반응 버튼 */
.unlock { margin: 40px auto 0; padding: 14px 35px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.6); background: rgba(0, 0, 0, 0.4); color: white; font-size: 14px; font-weight: bold; cursor: pointer; width: fit-content; display: block; outline: none; }
.unlock:active { background: rgba(0, 0, 0, 0.6); transform: scale(0.96); }

/* 홈 화면 */
#home { z-index: 10; display: none; }
.header { padding: 35px 24px 10px; text-align: left; color: white; z-index: 5; }
.header h2 { margin: 6px 0; font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.muted { font-size: 12px; opacity: 0.9; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

/* 앱 그리드 배열 */
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 8px; padding: 25px 15px; z-index: 5; }
.app { text-align: center; font-size: 12px; color: white; font-weight: bold; cursor: pointer; text-shadow: 0 1px 4px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; }
.ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; margin-bottom: 8px; font-size: 26px; color: white; box-shadow: 0 5px 12px rgba(0,0,0,0.3); text-shadow: none; }
.app:active .ico { transform: scale(0.92); }

.green { background: #4db779; }
.blue { background: #4b8ce0; }
.orange { background: #e5a052; }
.purple { background: #8b78d8; }
.gray { background: #737d88; }

/* 세부 화면 페이지 */
#page { z-index: 50; display: none; background: #f4f5f7; overflow-y: auto; color: #222; }
.back { background: #e7e9ed; padding: 14px 20px; border: none; width: 100%; text-align: left; font-size: 14px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #dcdde1; color: #111; outline: none; }
.page-title-bar { padding: 24px 20px 5px; background: #ffffff; }
#heading { font-size: 22px; color: #111; font-weight: bold; text-align: left; }
#list { padding: 0 10px 20px; background: #ffffff; width: 100%; }

.item { padding: 16px 14px; border-bottom: 1px solid #e2e3e6; cursor: pointer; text-align: left; }
.item b { font-size: 15px; color: #111; display: block; margin-bottom: 4px; }
.item small { display: block; color: #858990; font-size: 12px; }

/* 카카오톡 형태 대화방 */
#detail { padding: 15px; background: #b2c7da; min-height: calc(100% - 50px); display: flex; flex-direction: column; width: 100%; overflow-y: auto; }
.bubble { background: #ffec42; color: #000; padding: 10px 14px; border-radius: 14px 0px 14px 14px; margin: 6px 0 6px auto; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; word-break: break-all; }
.reply { background: white; color: #000; padding: 10px 14px; border-radius: 0px 14px 14px 14px; margin: 6px auto 6px 0; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; word-break: break-all; }
.photo { background: #e1e5e9; border-radius: 12px; padding: 24px 8px; text-align: center; margin: 8px 0; font-size: 14px; color: #222; }
input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; margin-top: 15px; font-size: 14px; outline: none; background: white; color: #000; }
</style>
</head>

    <!-- 세부 화면 구역 -->
    <section id="page" class="screen">

        <div class="page-title-bar"><h3 id="heading"></h3></div>
        <div id="list"></div>

    </section>
</div>
