<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
<title>이청현의 휴대폰</title>
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #17191d; font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif; color: #222; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

/* 스마트폰 1:1 비율 외부 해상도 고정 프레임 */
.phone { width: 360px; height: 740px; border-radius: 36px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); position: relative; overflow: hidden; display: flex; flex-direction: column; background: #000; }

/* 투명 스마트폰 상단바 인터페이스 */
.status { height: 32px; padding: 6px 18px; background: rgba(0, 0, 0, 0.2); font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: white; z-index: 100; font-weight: bold; }

/* 화면 전체 공통 뷰 규격 (화면 절대 겹치지 않게 구조 강제 정의) */
.screen { position: absolute; top: 32px; left: 0; width: 100%; height: calc(100% - 32px); display: flex; flex-direction: column; background-size: cover; background-position: center; }

/* 요청하신 마인크래프트 원본 배경화면 잠금 화면 지정 */
#lock { z-index: 30; padding: 40px 24px; text-align: center; background-image: url('https://squarespace-cdn.com'); justify-content: space-between; }
.clock { font-size: 64px; font-weight: 200; margin-top: 50px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
.date { font-size: 14px; margin-top: 5px; color: white; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }

/* 알림창 팝업 블러 필터 적용 */
.notification { margin-top: 65px; background: rgba(255, 255, 255, 0.25); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-radius: 16px; padding: 17px; text-align: left; line-height: 1.7; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
.unlock { margin-top: 45px; padding: 14px 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.6); background: rgba(0, 0, 0, 0.4); color: white; font-size: 14px; font-weight: bold; cursor: pointer; width: fit-content; margin-left: auto; margin-right: auto; outline: none; }
.unlock:active { background: rgba(0, 0, 0, 0.6); }

/* 홈 화면 레이아웃 (마인크래프트 배경 동일 세팅) */
#home { z-index: 10; display: none; background-image: url('https://squarespace-cdn.com'); }
.header { padding: 35px 24px 10px; text-align: left; color: white; }
.header h2 { margin: 6px 0; font-size: 26px; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.muted { font-size: 12px; opacity: 0.9; text-shadow: 0 1px 3px rgba(0,0,0,0.6); color: white; font-weight: bold; }

/* 3열 홈 화면 아이콘 그리드 전면 최적화 배치 */
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 8px; padding: 25px 15px; }
.app { text-align: center; font-size: 12px; color: white; font-weight: bold; cursor: pointer; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
.ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; margin: 0 auto 8px; font-size: 26px; color: white; box-shadow: 0 5px 10px rgba(0,0,0,0.3); }
.app:active .ico { transform: scale(0.92); }

.green { background: linear-gradient(135deg, #5ce19f, #229a57); }
.blue { background: linear-gradient(135deg, #66a6ff, #2962ff); }
.orange { background: linear-gradient(135deg, #ffb347, #ffcc00); }
.purple { background: linear-gradient(135deg, #cc99ff, #7744ff); }
.gray { background: linear-gradient(135deg, #a1a8b3, #4e5561); }

/* 내부 서브 상세페이지 인디케이터 */
#page { z-index: 20; display: none; background: #f4f5f7; overflow-y: auto; color: #222; }
.back { background: #e7e9ed; padding: 12px 15px; border: none; width: 100%; text-align: left; font-size: 14px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #dcdde1; }
.page-title-bar { padding: 24px 20px 5px; }
#heading { font-size: 22px; color: #111; font-weight: bold; }
#list { padding: 0 15px 20px; }

.item { padding: 16px 5px; border-bottom: 1px solid #e2e3e6; cursor: pointer; text-align: left; }
.item b { font-size: 15px; color: #111; }
.item small { display: block; color: #858990; margin-top: 5px; font-size: 12px; }
#detail { line-height: 1.8; white-space: pre-line; margin-top: 18px; padding: 15px; }

/* 카카오톡 노란색 디자인 메신저 인터페이스 복원 */
.bubble { background: #ffec42; color: #000; padding: 11px 14px; border-radius: 15px; margin: 10px 0 10px auto; width: fit-content; max-width: 85%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; }
.reply { background: white; color: #000; padding: 11px 14px; border-radius: 15px; margin: 10px auto 10px 0; width: fit-content; max-width: 85%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; }
.photo { background: #e1e5e9; border-radius: 12px; padding: 24px 8px; text-align: center; margin: 8px 0; font-size: 14px; }
input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; margin-top: 10px; font-size: 14px; outline: none; background: white; color: #000; }
</style>
</head>

<div class="phone">

    <div class="status">
        <span>20:18　● Wi-Fi</span>

    <section id="lock" class="screen">

        <div>

            <button class="unlock" onclick="unlock()">잠금 화면 열기　›</button>
        </div>
    </section>

    <!-- 홈 화면 -->
    <section id="home" class="screen">
        <div class="header">
            <div class="muted">내 휴대폰</div>
            <h2>이청현</h2>
            <div class="muted">마지막 사용 기록</div>
        </div>
        <div class="apps">
            <div class="app" onclick="openPage('messages')"><div class="ico green">✉</div>메시지</div>
            <div class="app" onclick="openPage('calls')"><div class="ico green">☎</div>전화</div>

            <div class="app" onclick="openPage('settings')"><div class="ico gray">⚙</div>설정</div>
        </div>
    </section>

    <!-- 세부 화면 구역 -->
    <section id="page" class="screen">
        <button class="back" onclick="back()">‹ 홈으로</button>
        <div class="page-title-bar"><h3 id="heading"></h3></div>
        <div id="list"></div>
        <div id="detail"></div>
    </section>
</div>
