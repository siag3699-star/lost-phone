<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no">
<title>이청현의 휴대폰</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { background: #11141a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

/* [구조 개편] 어떤 화면에서 보든 정중앙에 배치되는 스마트폰 본체 뼈대 */
.phone { width: 360px; height: 740px; border-radius: 40px; box-shadow: 0 30px 70px rgba(0,0,0,0.7); position: relative; overflow: hidden; display: flex; flex-direction: column; background: #000; border: 4px solid #2d3139; }

/* 실제 폰 전면 카메라 상단바 인터페이스 */
.status { height: 34px; padding: 0 20px; font-size: 12px; display: flex; justify-content: space-between; align-items: center; color: white; background: rgba(0,0,0,0.3); font-weight: bold; z-index: 100; backdrop-filter: blur(10px); }
.status-right { display: flex; align-items: center; gap: 6px; }
.wifi-dot { width: 5px; height: 5px; background: white; border-radius: 50%; display: inline-block; }

/* [겹침 차단] 잠금화면과 홈화면을 절대 섞이지 않게 가두는 독립 스크린 컨테이너 */
.screen { position: absolute; top: 34px; left: 0; width: 100%; height: calc(100% - 34px); display: flex; flex-direction: column; background-image: url('https://squarespace-cdn.com'); background-size: cover; background-position: center; transition: transform 0.4s cubic-bezier(0.1, 1, 0.1, 1), opacity 0.3s; }

/* 잠금 화면 (최상위 레이어 레이아웃 고정) */
#lock { z-index: 40; padding: 40px 24px 60px; justify-content: space-between; align-items: center; display: flex; }
.clock { font-size: 64px; font-weight: 100; margin-top: 40px; color: white; text-shadow: 0 2px 10px rgba(0,0,0,0.4); text-align: center; width: 100%; }
.date { font-size: 15px; margin-top: 2px; color: white; opacity: 0.95; text-shadow: 0 2px 8px rgba(0,0,0,0.4); text-align: center; width: 100%; }

/* 반투명 유리 느낌의 스타일리시 알림창 */
.notification { margin-top: 55px; background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 20px; padding: 18px; text-align: left; line-height: 1.5; box-shadow: 0 6px 20px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.2); color: white; width: 100%; }
.notification b { font-size: 14px; display: block; margin-bottom: 2px; }
.notification small { font-size: 12px; opacity: 0.9; }

/* 입체감 있는 모바일 전용 해제 콘솔 버튼 */
.unlock { margin: 0 auto; padding: 14px 35px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.5); background: rgba(0, 0, 0, 0.5); color: white; font-size: 14px; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.3); outline: none; }
.unlock:active { background: rgba(0, 0, 0, 0.7); transform: scale(0.95); }

/* 메인 바탕화면 (처음에는 레이어 뒤에 숨어있음) */
#home { z-index: 10; display: none; }
.header { padding: 40px 24px 10px; text-align: left; color: white; }
.header h2 { font-size: 28px; margin: 2px 0 6px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
.muted { font-size: 12px; opacity: 0.95; text-shadow: 0 1px 3px rgba(0,0,0,0.6); font-weight: bold; }

/* [정밀 정렬] 깔끔한 스마트폰 인터페이스 느낌을 주는 3열 앱 아이콘 배치 */
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 36px 15px; padding: 25px 24px; flex-grow: 1; align-content: flex-start; }
.app { display: flex; flex-direction: column; align-items: center; text-align: center; font-size: 12px; color: white; font-weight: bold; cursor: pointer; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
.ico { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; margin-bottom: 8px; font-size: 26px; color: white; box-shadow: 0 6px 12px rgba(0,0,0,0.35); transition: transform 0.1s; }
.app:active .ico { transform: scale(0.92); }

/* 세련된 아이콘 전용 둥근 그라데이션 테마 백그라운드 */
.green { background: linear-gradient(135deg, #5ce19f, #229a57); }
.blue { background: linear-gradient(135deg, #66a6ff, #2962ff); }
.orange { background: linear-gradient(135deg, #ffb347, #ffcc00); }
.purple { background: linear-gradient(135deg, #cc99ff, #7744ff); }
.gray { background: linear-gradient(135deg, #a1a8b3, #4e5561); }

/* 시스템 하위 슬라이딩 세부 페이지 (아래에서 위로 부드럽게 창이 올라옴) */
#page { z-index: 50; display: none; background: #f4f5f7; overflow-y: auto; color: #222; transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.1, 1, 0.1, 1); }
#page.active { transform: translateY(0); display: flex !important; }
.back { background: #ffffff; padding: 15px 20px; border: none; width: 100%; text-align: left; font-size: 14px; font-weight: bold; cursor: pointer; border-bottom: 1px solid #e2e3e6; color: #111; outline: none; }
.page-title-bar { padding: 24px 20px 5px; background: #ffffff; }
#heading { font-size: 22px; color: #111; font-weight: bold; }
#list { padding: 0 10px 20px; background: #ffffff; width: 100%; }

.item { padding: 16px 14px; border-bottom: 1px solid #f2f3f5; cursor: pointer; text-align: left; }
.item b { font-size: 15px; color: #111; display: block; margin-bottom: 3px; }
.item small { display: block; color: #8a8e96; font-size: 12px; }

/* 리얼 카카오톡 대화 콘솔방 구현 */
#detail { padding: 15px; background: #b2c7da; min-height: calc(100% - 50px); display: flex; flex-direction: column; width: 100%; }
.bubble { background: #ffec42; color: #000; padding: 10px 14px; border-radius: 14px 0px 14px 14px; margin: 6px 0 6px auto; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; word-break: break-all; }
.reply { background: white; color: #000; padding: 10px 14px; border-radius: 0px 14px 14px 14px; margin: 6px auto 6px 0; width: fit-content; max-width: 82%; font-size: 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.15); text-align: left; word-break: break-all; }
.photo { background: #ffffff; border-radius: 12px; padding: 40px 10px; text-align: center; margin: 8px 0; font-size: 14px; border: 1px solid #e2e3e6; }
input { padding: 12px; border: 1px solid #ddd; border-radius: 10px; width: 100%; margin-top: auto; font-size: 14px; outline: none; background: white; color: #000; }
</style>
</head>

            <button class="unlock" onclick="unlock()">잠금 화면 열기 〉</button>

            <div class="app" onclick="openPage('settings')"><div class="ico gray">⚙</div>설정</div>
        </div>
    </section>

    <!-- 슬라이드형 내부 서브 데스크 레이어 -->
    <section id="page" class="screen">
        <button class="back" onclick="back()">‹ 홈으로</button>
        <div class="page-title-bar"><h3 id="heading"></h3></div>
        <div id="list"></div>
        <div id="detail"></div>
    </section>
</div>
